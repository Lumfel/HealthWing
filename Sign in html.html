<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthWing | Sign In</title>
    <link rel="stylesheet" href="CS.css">
    <link rel="stylesheet" href="bone-loader.css">
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="bone-loader.js" defer></script>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h2>Sign In to HealthWing</h2>
            <!---
            <p style="font-size:12px;color:#4B6366;margin-bottom:12px;">
                Default Seed Accounts — User: <code>user</code> / <code>User@1234</code> &middot; Vet: <code>vet</code> / <code>Vet@1234</code>
            </p>
            -->
            <form id="loginForm" autocomplete="on">
                <div>
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" class="border border-gray-300 p-2 rounded-lg" placeholder="Enter username (e.g. user or vet)" autocomplete="username" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="border border-gray-300 p-2 rounded-lg" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <div class="remember-me-container" style="margin: 10px 0;">
                    <input type="checkbox" id="rememberMe" checked>
                    <label for="rememberMe">Remember me</label>
                </div>
                <div style="margin: 10px 0; display: flex; justify-content: center;">
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-action="login" data-theme="light"></div>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            <p class="register-text">Don't have an account? <a href="chooserole.html">Register</a> &middot; <a href="admin_login.html">Admin Login</a></p>
        </div>
    </div>

    <script src="JS.js" defer></script>

    <script>
      fetch('turnstile.php?action=config')
        .then(r => r.json())
        .then(cfg => {
          if (cfg && cfg.site_key) {
            document.querySelectorAll('.cf-turnstile').forEach(el => {
              if (el.getAttribute('data-sitekey') !== cfg.site_key) {
                el.setAttribute('data-sitekey', cfg.site_key);
                if (window.turnstile && typeof window.turnstile.render === 'function') {
                  el.innerHTML = '';
                  window.turnstile.render(el, { sitekey: cfg.site_key, theme: el.getAttribute('data-theme') || 'light' });
                }
              }
            });
          }
        })
        .catch(() => {});
    </script>

</body>
</html>
