<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8"/>
    <meta name="viewport" content=" width=device-width, initial-scale=1.0"/>
    <script src="vendor/tailwind/tailwind-browser.js"></script>
    <title>Choose Role</title>
    <link rel="stylesheet" href="pen.css"/>
    <link rel="stylesheet" href="bone-loader.css">
    <script src="bone-loader.js"defer></script>
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 min-h-screen flex items-center justify-center">
    <div class="role-container bg-white shadow-2xl rounded-2xl p-8 w-full max-w-3xl h-[400px] border-8 border-gray-300 flex flex-col items-center justify-center">
        
        <h2 class="text-3xl font-bold text-gray-700 mb-10 text-center">Choose Your Role</h2>
        
        <div class="flex flex-row gap-12 justify-center items-center w-full">
            <a href="Sign Up.html" class="flex flex-col items-center justify-center py-6 px-10 w-56 h-56 bg-gradient-to-r from-pink-500 to-yellow-400 text-white text-xl font-bold rounded-xl shadow-lg hover:from-pink-600 hover:to-yellow-500 transition-all">
                <img src="images/owner.png" alt="Developer Icon" class="mx-auto mb-4 w-16 h-16">
                <span class="text-center">I am an Owner</span>
            </a>

            <a href="SignUpVeterinarian.html" class="flex flex-col items-center justify-center py-6 px-10 w-56 h-56 bg-gradient-to-r from-pink-500 to-yellow-400 text-white text-xl font-bold rounded-xl shadow-lg hover:from-pink-600 hover:to-yellow-500 transition-all">
                <img src="images/veterinarian.png" alt="Developer Icon" class="mx-auto mb-4 w-16 h-16">
                <span class="text-center">I am a Veterinarian</span>
            </a>
        </div>
    </div>

    <script src="script.js"defer></script>
